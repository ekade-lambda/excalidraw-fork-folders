[package]
name = "bridge"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tower-http = { version = "0.5", features = ["cors"] }
tokio-postgres = { version = "0.7.18", features = ["with-chrono-0_4", "with-serde_json-1"] }
chrono = "0.4"
dotenvy = "0.15.7"
deadpool-postgres = "0.14.2"
base64 = "0.23.1"
sha2 = "0.11.0"
rand = "0.10.2"
hex = "0.4.3"
zip = "2.2.0"
uuid = { version = "1.10.0", features = ["v4"] }

[dependencies.windows]
version = "0.58.0"
features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_System_IO",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_System_Ole", "Win32_UI_WindowsAndMessaging"
]

